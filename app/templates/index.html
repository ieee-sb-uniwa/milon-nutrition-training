<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Classifier</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 18px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #aaa; background: #f7f7f7; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    input[type="file"] { padding: 10px; border: 1px dashed #aaa; border-radius: 10px; }
    img { max-width: 260px; border-radius: 12px; border: 1px solid #ddd; }
    .result { margin-top: 14px; padding: 12px; background: #fafafa; border: 1px solid #eee; border-radius: 12px; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Product Image Classifier</h1>
  <div class="card">
    <div class="row">
      <input id="file" type="file" accept="image/*" />
      <button id="btn" disabled>Predict</button>
    </div>

    <div class="row" style="margin-top: 16px;">
      <img id="preview" alt="preview" style="display:none;" />
      <div style="flex:1; min-width: 260px;">
        <div id="status" class="result">Choose an image to begin.</div>
        <div id="out" class="result" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file");
    const btn = document.getElementById("btn");
    const preview = document.getElementById("preview");
    const statusBox = document.getElementById("status");
    const outBox = document.getElementById("out");

    let selectedFile = null;

    fileInput.addEventListener("change", () => {
      outBox.style.display = "none";
      outBox.textContent = "";

      if (!fileInput.files || fileInput.files.length === 0) {
        selectedFile = null;
        btn.disabled = true;
        preview.style.display = "none";
        statusBox.textContent = "Choose an image to begin.";
        return;
      }

      selectedFile = fileInput.files[0];
      btn.disabled = false;

      // Preview
      const url = URL.createObjectURL(selectedFile);
      preview.src = url;
      preview.style.display = "block";

      statusBox.textContent = "Ready. Click Predict.";
    });

    btn.addEventListener("click", async () => {
      if (!selectedFile) return;

      btn.disabled = true;
      statusBox.textContent = "Predicting...";

      try {
        const form = new FormData();
        form.append("file", selectedFile);

        const res = await fetch("/predict", {
          method: "POST",
          body: form
        });

        const data = await res.json();

        if (!res.ok) {
          outBox.style.display = "block";
          outBox.innerHTML = `<span class="err">Error:</span> ${data.error || "Unknown error"}`;
          statusBox.textContent = "Try again.";
          return;
        }

        outBox.style.display = "block";
        outBox.innerHTML = `
          <b>Prediction:</b> ${data.label}<br/>
          <b>Confidence:</b> ${(data.confidence * 100).toFixed(2)}%
        `;
        statusBox.textContent = "Done.";
      } catch (e) {
        outBox.style.display = "block";
        outBox.innerHTML = `<span class="err">Error:</span> ${e}`;
        statusBox.textContent = "Try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
